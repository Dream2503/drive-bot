name: UploadLabs
version: '1.0.0'
main: me.dream.drivebot.DriveBot
api-version: '1.21'
author: Dream
description: Store files inside Minecraft chunks.

commands:
  upload:
    description: Upload a file into the world.
    usage: /upload
    permission: uploadlabs.upload

permissions:
  uploadlabs.upload:
    description: Allows the use of /upload.
    default: op
