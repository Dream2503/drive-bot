name: Python type checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install type-checking dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply safe Ruff fixes
        run: ruff check --fix --exit-zero .
      - name: Commit safe Ruff fixes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "No safe Ruff fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend core
          git commit -m "Apply safe Ruff type modernization [skip ci]"
          git push origin "$GITHUB_REF_NAME"
      - name: Compile Python source
        run: python -m compileall -q backend core
      - name: Check all annotations
        run: ruff check --select ANN .
      - name: Run Ruff rules
        run: ruff check .
      - name: Run strict mypy
        run: mypy --strict backend core
