[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storelimitless"
version = "0.1.0"
description = "Python SDK for StoreLimitless"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
